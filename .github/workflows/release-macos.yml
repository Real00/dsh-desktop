name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (Apple Silicon)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: DSH Desktop ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          releaseBody: |
            Apple Silicon (aarch64) macOS build for DSH Desktop.

            First-run notes:
            - Requires Node.js ≥ 22.19 on the machine (used to launch `@deepseek-ai/dsh`).
            - Default plugins on first launch: dshmarket, loopx.
            - Unsigned builds may need right-click → Open on Gatekeeper.
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin --bundles dmg,app
